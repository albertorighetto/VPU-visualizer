name: Build VPU Visualizer

# Builds standalone executables for Windows, Linux, and macOS
# (both Apple Silicon and Intel). PyInstaller cannot cross-compile,
# so each target builds its own binary on a native GitHub-hosted
# runner; trigger this (push a "v*" tag or run manually) and download
# the artifacts for all four platform builds.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: VPU-Visualizer-windows
          - os: ubuntu-latest
            artifact: VPU-Visualizer-linux
          - os: macos-latest
            artifact: VPU-Visualizer-macos-arm64
          - os: macos-13
            artifact: VPU-Visualizer-macos-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --noconfirm vpu_visualizer.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/VPU-Visualizer*
          if-no-files-found: error
